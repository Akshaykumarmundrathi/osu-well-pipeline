version: 0.2
# Builds the OSU pipeline image in AWS CodeBuild (no local Docker needed) and
# pushes to ECR. Source is an S3 bundle that includes the gitignored model
# (unet_best.pth) + unet_dot_detector.py. Env vars set by the CodeBuild project:
#   AWS_REGION, ECR_REGISTRY, ECR_URI, IMAGE_TAG
phases:
  pre_build:
    commands:
      - echo "ECR login..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - echo "Building $ECR_URI:$IMAGE_TAG"
      - docker build -t "$ECR_URI:$IMAGE_TAG" -t "$ECR_URI:latest" .
  post_build:
    commands:
      - echo "Pushing..."
      - docker push "$ECR_URI:$IMAGE_TAG"
      - docker push "$ECR_URI:latest"
      - echo "Done -> $ECR_URI:$IMAGE_TAG"
