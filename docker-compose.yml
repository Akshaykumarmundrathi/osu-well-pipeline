# Local development / smoke-test compose.
# Usage:
#   docker compose up --build
#
# For a real run set INPUT_BUCKET / OUTPUT_BUCKET env vars or edit the
# environment section below.  Credentials come from .env (copy .env.example).

version: "3.9"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OUTPUT_ROOT: /tmp/output
      # Override these per-run; values in .env are used as fallback
      # INPUT_BUCKET: osu-well-records-225989338968
      # OUTPUT_BUCKET: osu-well-records-225989338968
      # INDEX_KEY: index/dataset_index.csv
      SLICE_SIZE: "50"       # small slice for local tests
      WORKERS: "2"
      AWS_BATCH_JOB_ARRAY_INDEX: "0"
    volumes:
      # Mount a local output folder so you can inspect results without S3
      - ./local_output:/tmp/output
      # If using a local GCP credentials file (dev only)
      - ./credentials:/credentials:ro
    # Override entrypoint for local smoke-test (skip S3 upload)
    # Comment out to run the full Batch entrypoint.
    # command: ["python", "/app/main.py", "--index", "/tmp/output/slice.csv", "--output", "/tmp/output"]
